name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Archive plugin
        uses: actions/upload-artifact@v4
        with:
          name: google-groups-oauth.hpi
          path: target/*.hpi
