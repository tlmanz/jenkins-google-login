name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test (with coverage gate)
        run: ./mvnw -B -ntp -Penable-jacoco verify
      - name: Archive plugin
        uses: actions/upload-artifact@v4
        with:
          name: google-groups-oauth.hpi
          path: target/*.hpi
